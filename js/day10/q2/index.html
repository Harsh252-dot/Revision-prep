<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sortable Table</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <h2>Sortable Table</h2>

  <table>
    <thead>
      <tr>
        <th data-key="name">Name <span></span></th>
        <th data-key="age">Age <span></span></th>
        <th data-key="salary">Salary <span></span></th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
